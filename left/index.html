<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <title>基隆左區 3D 模型</title>

  <script src="https://cesium.com/downloads/cesiumjs/releases/1.129/Build/Cesium/Cesium.js"></script>
  <link
    href="https://cesium.com/downloads/cesiumjs/releases/1.129/Build/Cesium/Widgets/widgets.css"
    rel="stylesheet"
  />

  <style>
    html, body, #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    .title-box {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10;
      padding: 12px 16px;
      background: rgba(0, 0, 0, 0.62);
      color: white;
      border-radius: 10px;
      font-family: "Noto Sans TC", Arial, sans-serif;
    }

    .title-box h1 {
      font-size: 18px;
      margin: 0 0 4px 0;
    }

    .title-box p {
      font-size: 13px;
      margin: 0;
      opacity: 0.88;
    }
  </style>
</head>

<body>
  <div id="cesiumContainer"></div>

  <div class="title-box">
    <h1>基隆左區 3D 模型</h1>
    <p>Cesium ion Asset ID：4835770</p>
  </div>

  <script>
    Cesium.Ion.defaultAccessToken = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiI0ZGUzZTNlYS1kYzZhLTQxZjItYTJlMy0wYTQzMzU2MGI5NzkiLCJpZCI6NDM2MDI4LCJzdWIiOiJKZW4gY2hpZWggbGl1IiwiaXNzIjoiaHR0cHM6Ly9hcGkuY2VzaXVtLmNvbSIsImF1ZCI6IuWfuumahuW3puWNgCIsImlhdCI6MTc3OTcyMjk4NH0.w_5UkWrE_-SrMsLLE9AtALQ-9jOm0QLXhDJoE_hqhz0";

    const viewer = new Cesium.Viewer("cesiumContainer", {
      terrain: Cesium.Terrain.fromWorldTerrain(),
      timeline: false,
      animation: false,
      geocoder: false,
      navigationHelpButton: false
    });

    async function loadModel() {
      try {
        const tileset = viewer.scene.primitives.add(
          await Cesium.Cesium3DTileset.fromIonAssetId(4835770)
        );

        await viewer.zoomTo(tileset);
      } catch (error) {
        console.error("基隆左區模型載入失敗：", error);
        alert("基隆左區模型載入失敗，請確認 Token、Asset ID 與 Cesium ion 權限。");
      }
    }

    loadModel();
  </script>
</body>
</html>
